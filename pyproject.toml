[project]
name = "uav-landing-project"
version = "0.1.0"
description = "UAV Landing System with Neuro-Symbolic Computing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core machine learning and deep learning
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    
    # Computer vision and image processing
    "opencv-python>=4.11.0.86",
    "opencv-python-headless>=4.11.0.86",
    "opencv-contrib-python>=4.7.0",
    "Pillow>=9.5.0",
    "scikit-image>=0.20.0",
    "albumentations>=1.3.0",
    
    # Scientific computing and data manipulation
    "numpy>=2.3.1",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # Machine learning utilities
    "scikit-learn>=1.7.1",
    "tqdm>=4.65.0",
    "tensorboard>=2.13.0",
    "timm>=0.9.0",
    
    # Model deployment and inference
    "onnx>=1.18.0",
    "onnxruntime-gpu>=1.22.0", # GPU support - fallback to onnxruntime for CPU-only
    
    # Experiment tracking and monitoring
    "wandb>=0.21.0",
    
    # Dataset downloading utilities
    "kaggle>=1.5.0",
    "gdown>=4.7.0",
    "requests>=2.31.0",
    
    # System monitoring
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "pynvml>=11.5.0",
    
    # Additional utilities
    "typing-extensions>=4.7.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "shapely>=2.0.0",
    "dataclasses-json>=0.6.0",
    "tifffile>=2025.6.11",
    
    # Testing (core)
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.14.1",
]

[project.optional-dependencies]
dev = [
    # Code quality and formatting
    "black>=23.7.0",
    "flake8>=6.0.0", 
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    
    # Jupyter and notebooks
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
    
    # Documentation
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.14.1",
]

cpu-only = [
    "onnxruntime>=1.22.0",  # CPU-only version for systems without GPU
]

deployment = [
    # Advanced model deployment
    "tensorrt>=8.6.0",  # For NVIDIA deployment
    "accelerate>=0.21.0",  # For distributed training
]

visualization = [
    # Advanced visualizations
    "plotly>=5.15.0",
    "bokeh>=3.2.0",
]

build = [
    "maturin>=1.9.1",
]

# Platform-specific extras
cuda = [
    "torch[cuda]>=2.7.1",
]

mps = [
    "torch[mps]>=2.7.1",  # For Apple Silicon (M1/M2 Macs)
]

intel = [
    "intel-extension-for-pytorch",  # For Intel optimization
]
